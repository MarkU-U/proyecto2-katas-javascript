<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 5</title>
    <script src="./script.js" defer></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.78);
        --panel-border: rgba(255, 255, 255, 0.12);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(56, 189, 248, 0.28), transparent 32%),
          radial-gradient(circle at bottom right, rgba(245, 158, 11, 0.18), transparent 28%),
          linear-gradient(135deg, #020617 0%, #0f172a 45%, #111827 100%);
        display: grid;
        place-items: center;
        padding: 32px;
      }

      .app-shell {
        width: min(900px, 100%);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
        overflow: hidden;
      }

      .hero {
        padding: 32px 32px 0;
      }

      .eyebrow {
        margin: 0 0 10px;
        text-transform: uppercase;
        letter-spacing: 0.24em;
        font-size: 0.75rem;
        color: var(--accent);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 0.95;
      }

      .subtitle {
        max-width: 58ch;
        color: var(--muted);
        margin: 16px 0 0;
        font-size: 1rem;
        line-height: 1.6;
      }

      .content {
        padding: 28px 32px 32px;
      }

      .albums-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 14px;
      }

      .album-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 20px;
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.18);
      }

      .album-index {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #0f172a;
        font-weight: 800;
        flex: none;
      }

      .album-name {
        font-size: 1.05rem;
        font-weight: 600;
      }

      @media (max-width: 640px) {
        body {
          padding: 16px;
        }

        .hero,
        .content {
          padding-left: 20px;
          padding-right: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <p class="eyebrow">DOM Exercise 5</p>
        <h1>Albums list</h1>
        <p class="subtitle">Una lista dinámica de álbumes con un acabado más cercano a una pequeña web completa.</p>
      </section>
      <section class="content">
        <ul id="albums-list" class="albums-list"></ul>
      </section>
    </main>
  </body>
</html>
