<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 9</title>
    <script src="./index.js" defer></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #dbeafe, #f8fafc 55%, #e2e8f0);
        font-family: Arial, sans-serif;
      }

      .card {
        width: min(560px, calc(100% - 32px));
        padding: 28px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.15);
        text-align: center;
      }

      .random-image {
        width: 100%;
        max-width: 420px;
        min-height: 320px;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <img class="random-image" alt="Random Pokemon" />
    </section>
  </body>
</html>
